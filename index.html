<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JergBuilder</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #87ceeb; /* Sky blue background fallback */
        }

        /* THREE.JS CANVAS */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1;
            display: block;
        }

        /* OVERLAY CONTAINER */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: none; /* Allows pointer clicks to pass through transparent areas */
            background: transparent;
        }

        /* MENU PANELS */
        .menu-panel {
            pointer-events: auto; /* Re-enables clicks for buttons inside panels */
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: rgba(20, 20, 20, 0.85);
            border: 2px solid #555;
            padding: 28px;
            border-radius: 8px;
            min-width: 320px;
            align-items: center;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .menu-panel h2 {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
        }

        .hidden {
            display: none !important;
        }

        /* INPUT FIELD STYLES */
        .menu-input {
            width: 100%;
            padding: 10px 14px;
            background: #222;
            color: #fff;
            border: 2px solid #555;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .menu-input:focus {
            border-color: #00ffcc;
        }

        /* BUTTON STYLES */
        .menu-btn {
            width: 100%;
            padding: 12px 20px;
            background: #3c3c3c;
            color: #ffffff;
            border: 2px solid #666;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .menu-btn:hover {
            background: #555;
            border-color: #fff;
        }

        /* CROSSHAIR */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }

        /* HOTBAR HUD */
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
            border-radius: 6px;
            border: 2px solid #444;
            z-index: 100;
            pointer-events: auto;
        }

        .hotbar-slot {
            width: 44px;
            height: 44px;
            border: 2px solid #555;
            background-color: #222;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            position: relative;
        }

        .hotbar-slot.active {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        .hotbar-color-preview {
            width: 28px;
            height: 28px;
            border-radius: 2px;
            border: 1px solid rgba(0, 0, 0, 0.5);
        }

        .hotbar-number {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            text-shadow: 1px 1px 1px #000;
        }

        /* CHAT SYSTEM OVERLAY */
        #chat-container {
            position: absolute;
            bottom: 80px;
            left: 20px;
            width: 320px;
            z-index: 100;
            pointer-events: none;
        }

        #chat-messages {
            max-height: 160px;
            overflow-y: auto;
            margin-bottom: 6px;
            text-shadow: 1px 1px 3px #000;
            color: #fff;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        #chat-input {
            width: 100%;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #fff;
            color: #fff;
            pointer-events: auto;
            border-radius: 4px;
            font-family: inherit;
            outline: none;
        }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="hotbar"></div>

    <div id="chat-container">
        <div id="chat-messages"></div>
        <input type="text" id="chat-input" class="hidden" placeholder="Press Enter to talk..." maxlength="100">
    </div>

    <div id="ui-overlay">

        <div id="menu-title" class="menu-panel">
            <h2>JergBuilder</h2>
            <button id="btn-worlds" class="menu-btn">Worlds</button>
            <button id="btn-multiplayer" class="menu-btn">Multiplayer</button>
            <button id="btn-mods" class="menu-btn">Mods</button>
            <button id="btn-skin" class="menu-btn">Select Skin</button>
            <button id="btn-settings" class="menu-btn">Settings</button>
        </div>

        <div id="menu-worlds" class="menu-panel hidden">
            <h2>Select World</h2>
            <button id="btn-play-world" class="menu-btn">Play World</button>
            <button class="menu-btn btn-back">Back</button>
        </div>

        <div id="menu-multiplayer" class="menu-panel hidden">
            <h2>Multiplayer</h2>
            <input type="text" id="player-username" class="menu-input" placeholder="Username" maxlength="16">
            <input type="text" id="server-url" class="menu-input" value="https://jergbserver.onrender.com" placeholder="Server URL">
            <button id="btn-connect-server" class="menu-btn">Join Server</button>
            <button class="menu-btn btn-back">Back</button>
        </div>

        <div id="menu-mods" class="menu-panel hidden">
            <h2>Mod Manager</h2>
            <p style="font-size: 12px; color: #aaa; text-align: center;">Upload a .js mod file to insert dynamic code.</p>
            
            <label for="mod-file-input" class="menu-btn" style="text-align: center; display: block; line-height: 24px;">
                📁 Load JS Mod File
            </label>
            <input type="file" id="mod-file-input" accept=".js" style="display: none;">

            <div id="loaded-mods-list" style="font-size: 13px; color: #00ffcc; text-align: center;"></div>

            <button class="menu-btn btn-back">Back</button>
        </div>

        <div id="menu-skin" class="menu-panel hidden">
            <h2>Select Skin</h2>
            <p style="font-size: 13px; color: #aaa;">Default Skin Active</p>
            <button class="menu-btn btn-back">Back</button>
        </div>

        <div id="menu-settings" class="menu-panel hidden">
            <h2>Settings</h2>
            <p style="font-size: 13px; color: #aaa;">FOV: 75 | Sensitivity: 1.0</p>
            <button class="menu-btn btn-back">Back</button>
        </div>

    </div>

    <script type="module" src="Js/main.js"></script>
</body>
</html>
