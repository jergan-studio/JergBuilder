<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JergBuilder</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="ui-overlay">
        <div id="menu-title" class="menu-panel">
            <h1 class="title-text">JERGBUILDER</h1>
            <button id="btn-worlds" class="menu-btn">Worlds</button>
            <button id="btn-skin" class="menu-btn">Select Skin</button>
            <button id="btn-settings" class="menu-btn">Settings</button>
        </div>

        <div id="menu-worlds" class="menu-panel hidden">
            <h2>Worlds</h2>
            <button id="btn-play-world" class="menu-btn">Play World</button>
            <button class="menu-btn btn-back">Back</button>
        </div>

        <div id="menu-skin" class="menu-panel hidden">
            <h2>Select Skin</h2>
            <p style="color: #aaa; font-size: 14px;">Default Skin Selected</p>
            <button class="menu-btn btn-back">Back</button>
        </div>

        <div id="menu-settings" class="menu-panel hidden">
            <h2>Settings</h2>
            <p style="color: #aaa; font-size: 14px;">FOV: 75 | Sensitivity: 1.0</p>
            <button class="menu-btn btn-back">Back</button>
        </div>
    </div>

    <script type="module" src="Js/main.js"></script>
</body>
</html>
