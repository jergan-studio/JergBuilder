<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JergBuilder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #000;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* --- UI OVERLAY CONTAINER --- */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
        }

        /* --- MENU PANELS --- */
        .menu-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: rgba(20, 20, 20, 0.85);
            border: 3px solid #444;
            padding: 30px;
            border-radius: 8px;
            min-width: 320px;
            align-items: center;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .menu-panel h2 {
            font-size: 24px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e0e0e0;
            text-shadow: 2px 2px #000;
        }

        .hidden {
            display: none !important;
        }

        /* --- MINECRAFT STYLE BUTTONS --- */
        button {
            width: 100%;
            padding: 12px 20px;
            background: #3c3c3c;
            color: #ffffff;
            border: 2px solid #555555;
            border-top-color: #777777;
            border-left-color: #777777;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px #000;
            transition: all 0.1s ease;
        }

        button:hover {
            background: #4a4a4a;
            border-color: #ffffff;
        }

        button:active {
            background: #2a2a2a;
            border-top-color: #333333;
            border-left-color: #333333;
        }

        /* --- HUD CROSSHAIR --- */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #crosshair::before {
            top: 5px;
            left: 0;
            width: 12px;
            height: 2px;
        }

        #crosshair::after {
            top: 0;
            left: 5px;
            width: 2px;
            height: 12px;
        }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="ui-overlay">
        <div id="menu-title" class="menu-panel">
            <h2>JergBuilder</h2>
            <button id="btn-worlds">Worlds</button>
            <button id="btn-skin">Select Skin</button>
            <button id="btn-settings">Settings</button>
        </div>

        <div id="menu-worlds" class="menu-panel hidden">
            <h2>Select World</h2>
            <button id="btn-play-world">Play World</button>
            <button class="btn-back">Back</button>
        </div>

        <div id="menu-skin" class="menu-panel hidden">
            <h2>Select Skin</h2>
            <button class="btn-back">Back</button>
        </div>

        <div id="menu-settings" class="menu-panel hidden">
            <h2>Settings</h2>
            <button class="btn-back">Back</button>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
