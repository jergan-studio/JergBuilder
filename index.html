<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JergBuilder</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #87ceeb;
        }

        /* THREE.JS CANVAS FIX */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1;
            display: block;
        }

        /* OVERLAY CONTAINER */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: none; /* Allows canvas interactions underneath */
            background: transparent;
        }

        /* MENU PANELS */
        .menu-panel {
            pointer-events: auto; /* Enables mouse clicks on buttons */
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: rgba(20, 20, 20, 0.85);
            border: 2px solid #555;
            padding: 28px;
            border-radius: 8px;
            min-width: 320px;
            align-items: center;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .menu-panel h2 {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
        }

        .hidden {
            display: none !important;
        }

        /* INPUT FIELD STYLES */
        .menu-input {
            width: 100%;
            padding: 10px 14px;
            background: #222;
            color: #fff;
            border: 2px solid #555;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .menu-input:focus {
            border-color: #00ffcc;
        }

        /* BUTTON STYLES */
        .menu-btn {
            width: 100%;
            padding: 12px 20px;
            background: #3c3c3c;
            color: #ffffff;
            border: 2px solid #666;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .menu-btn:hover {
            background: #555;
            border-color: #fff;
        }

        /* CROSSHAIR */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }

        /* HOTBAR HUD */
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
            border-radius: 6px;
            border: 2px solid #444;
            z-index: 100;
            pointer-events: auto;
        }

        .hotbar-slot {
            width: 44px;
            height: 44px;
            border: 2px solid #555;
            background-color: #222;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            position: relative;
        }

        .hotbar-slot.active {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        .hotbar-color-preview {
            width: 28px;
            height: 28px;
            border-radius: 2px;
            border: 1px solid rgba(0, 0, 0, 0.5);
        }

        .hotbar-number {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            text-shadow: 1px 1px 1px #000;
        }

        /* CHAT SYSTEM OVERLAY */
        #chat-container {
            position: absolute;
            bottom: 80px;
            left: 20px;
            width: 320px;
            z-index: 100;
            pointer-events: none;
