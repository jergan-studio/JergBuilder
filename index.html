<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JergBuilder</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #87ceeb;
        }

        /* CANVAS */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1;
            display: block;
        }

        /* OVERLAY CONTAINER */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.25);
        }

        /* MENU PANELS */
        .menu-panel {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #555;
            padding: 28px;
            border-radius: 8px;
            min-width: 320px;
            align-items: center;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
        }

        .menu-panel h2 {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 4px;
        }

        .hidden {
            display: none !important;
        }

        /* BUTTON STYLES */
        .menu-btn {
            width: 100%;
            padding: 12px 20px;
            background: #3c3c3c;
            color: #ffffff;
            border: 2px solid #666;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.15s ease;
        }

        .menu-btn:hover {
            background: #555;
            border-color: #00ffcc;
            color: #00ffcc;
        }

        /* SKIN SELECTION GRID */
        .skin-options {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .skin-card {
            width: 60px;
            height: 60px;
            border: 2px solid #555;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            background: #222;
            transition: transform 0.15s ease;
        }

        .skin-card:hover {
            transform: scale(1.05);
        }

        .skin-card.selected {
            border-color: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
        }

        /* SETTINGS CONTROLS */
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-size: 14px;
            gap: 10px;
        }

        .setting-row input[type="range"] {
            cursor: pointer;
        }

        /* HUD CROSSHAIR */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
        }

        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }

        /* HOTBAR HUD */
        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
            border-radius: 6px;
            border: 2px solid #444;
            z-index: 100;
            pointer-events: auto;
        }

        .hotbar-slot {
            width: 44px;
            height: 44px;
            border: 2px solid #555;
            background-color: #222;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            position: relative;
        }

        .hotbar-slot.active {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        .hotbar-color-preview {
            width: 28px;
            height: 28px;
            border-radius: 2px;
            border: 1px solid rgba(0, 0, 0, 0.5);
        }

        .hotbar-number {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            text-shadow: 1px 1px 1px #000;
        }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="hotbar"></div>

    <div id="ui-overlay">

        <div id="menu-title" class="menu-panel">
            <h2>JergBuilder</h2>
            <button id="btn-worlds" class="menu-btn">Worlds</button>
            <button id="btn-mods" class="menu-btn">Mods</button>
            <button id="btn-skin" class="menu-btn">Select Skin</button>
            <button id="btn-settings" class="menu-btn">Settings</button>
        </div>

        <div id="menu-worlds" class="menu-panel hidden">
            <h2>Select World</h2>
            <button id="btn-play-world" class="menu-btn">▶ Play Singleplayer</button>
            <button class="menu-btn btn-back">Back</button>
        </div>

        <div id="menu-mods" class="menu-panel hidden">
            <h2>Mod Manager</h2>
            <p style="font-size: 12px; color: #aaa; text-align: center;">Upload a .js file to run custom code.</p>
            
            <label for="mod-file-input" class="menu-btn" style="text-align: center; display: block; line-height: 20px;">
                📁 Load Mod Script
            </label>
            <input type="file" id="mod-file-input" accept=".js" style="display: none;">

            <div id="loaded-mods-list" style="font-size: 13px; color: #00ffcc; text-align: center;"></div>

            <button class="menu-btn btn-back">Back</button>
        </div>

        <div id="menu-skin" class="menu-panel hidden">
            <h2>Select Skin</h2>
            <div class="skin-options">
                <div class="skin-card selected" data-skin="default" style="color: #00ffcc;">Default</div>
                <div class="skin-card" data-skin="blue" style="color: #1e90ff;">Blue</div>
                <div class="skin-card" data-skin="red" style="color: #ff3333;">Red</div>
            </div>
            <p id="skin-status" style="font-size: 13px; color: #aaa;">Active Skin: Default</p>
            <button class="menu-btn btn-back">Back</button>
        </div>

        <div id="menu-settings" class="menu-panel hidden">
            <h2>Settings</h2>
            <div class="setting-row">
                <span>FOV: <span id="fov-value">75</span></span>
                <input type="range" id="fov-slider" min="60" max="110" value="75">
            </div>
            <button class="menu-btn btn-back">Back</button>
        </div>

    </div>

    <script type="module" src="Js/main.js"></script>
</body>
</html>
